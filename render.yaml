services:
  - type: web
    name: datahelix-research-studio
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false